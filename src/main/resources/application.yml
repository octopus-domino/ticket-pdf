server:
  port: 8080
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  jackson:
    deserialization:
      fail-on-unknown-properties: false
      fail-on-ignored-properties: false
      fail-on-null-for-primitives: false

  datasource:
    url: jdbc:h2:file:./data/ticket-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  h2:
    console:
      enabled: false
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ openid, profile, email ]
            redirect-uri: "${APP_FRONTEND_URL:https://www.codoc.site}/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:${SMTP_PORT_SSL:465}}
    protocol: smtp
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SMTP_READ_TIMEOUT:30000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:30000}
          ssl:
            enable: ${SMTP_SSL:true}
          starttls:
            enable: ${SMTP_TLS:false}
            required: ${SMTP_TLS:false}

app:
  hoith:
    gpkg-path: ${HOITH_GPKG_PATH:./data/hoith.gpkg}
    import-on-startup: ${HOITH_IMPORT_ON_STARTUP:false}
    cities: ${HOITH_CITIES:}
    refresh-on-start: ${HOITH_REFRESH_ON_START:false}
    before-year: ${HOITH_BEFORE_YEAR:1945}
  mystic:
    csv-path: ${MYSTIC_CSV_PATH:classpath:mystic_places.csv}
    refresh-on-start: ${MYSTIC_REFRESH_ON_START:false}
  mcp:
    osm:
      url: ${OSM_MCP_URL:http://localhost:8000/mcp}
      enabled: ${OSM_MCP_ENABLED:true}
    commons:
      url: ${COMMONS_MCP_URL:https://gateway.pipeworx.io/commons-wikimedia/mcp}
      enabled: ${COMMONS_MCP_ENABLED:true}
  journeys:
    yandex-api-key: ${YANDEX_MAPS_API_KEY:}
    brouter-http:
      enabled: ${BROUTER_HTTP_ENABLED:true}
      url: ${BROUTER_HTTP_URL:https://brouter.de}
    valhalla:
        enabled: ${VALHALLA_ENABLED:true}
        url: ${VALHALLA_URL:https://valhalla1.openstreetmap.de}
    osrm:
      enabled: ${OSRM_ENABLED:false}
      url: ${OSRM_URL:https://routing.openstreetmap.de}
    brouter:
      enabled: ${BROUTER_ENABLED:true}
      router-home: ${BROUTER_HOME:/opt/brouter}
      router-cache: ${BROUTER_CACHE:/app/data/routing}
    max-wikidata-sitelinks: 5
    photon-url: ${PHOTON_URL:https://photon.komoot.io/api/}
    overpass-url: ${OVERPASS_URL:https://overpass-api.de/api/interpreter}
    wikimapia-key: ${WIKIMAPIA_API_KEY:${WIKIMAPIA_KEY:}}
    wikimapia:
      bbox-radius-km: 2.5
      box-page-size: 100
      max-details-per-request: 25
      min-description-length: 20
      quota:
        minute-limit: 20
        daily-limit: 5000
    walk-themes:
      bars:
        tags: ["amenity=bar", "amenity=pub", "amenity=biergarten", "amenity=wine_bar"]
        wikimapia-categories: ["bar", "pub", "бар", "паб"]
        require-hours: true
      mystic:
        tags: ["historic=ruins", "abandoned:place=*", "man_made=adit", "military=bunker", "historic=aircraft_wreck"]
        wikimapia-categories: ["abandoned", "ghost", "haunted", "заброш", "призрак", "мистик"]
        description-keywords: ["призрак", "легенда", "заброшен", "тайна", "мистик", "ghost", "haunted", "legend", "abandoned", "mystic"]
        require-hours: false
      religious:
        tags: ["amenity=place_of_worship", "building=church", "building=cathedral", "building=mosque", "amenity=monastery"]
        wikimapia-categories: ["church", "monastery", "chapel", "temple", "церковь", "монастыр", "часовн", "храм", "мечеть"]
        require-hours: true
      cultural:
        tags: ["tourism=museum", "tourism=gallery", "amenity=arts_centre", "amenity=theatre", "historic=monument"]
        wikimapia-categories: ["museum", "theatre", "art", "музей", "театр", "искусств", "памятник"]
        require-hours: true
  frontend-url: ${APP_FRONTEND_URL:https://www.codoc.site}
  cookie-secure: ${APP_COOKIE_SECURE:true}

  # B11: скрывать ли детали исключений в 500-ответах.
  # В prod — false (значение по умолчанию). В локальном профиле можно
  # включить, чтобы видеть причину в браузере без похода в логи.
  expose-error-details: ${APP_EXPOSE_ERROR_DETAILS:false}

  # H1: rate limit для дорогих эндпоинтов.
  # Токен-бакет per-user (или IP для анонимных). Значения — «за минуту».
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    export-per-minute: ${APP_RATE_LIMIT_EXPORT:20}
    generate-per-minute: ${APP_RATE_LIMIT_GENERATE:10}
    route-per-minute: ${APP_RATE_LIMIT_ROUTE:30}

  # B8: лимит байтов кэша изображений в HttpImageEmbedder.
  # При превышении старые записи вытесняются.
  image-embedder:
    max-cache-bytes: ${APP_IMAGE_CACHE_BYTES:67108864}  # 64 MB
  email:
    default-from: ${EMAIL_FROM:${SMTP_USER}}
    default-subject: ${EMAIL_SUBJECT:Документ от codoc}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-replace-me-in-prod-000000}
  access-token-ttl-ms: 900000
  refresh-token-ttl-ms: 604800000
  issuer: ticket-editor

logging:
  level:
    io.modelcontextprotocol: "OFF"
    ru.ticket: INFO
    org.apache.pdfbox: WARN
    org.apache.batik: WARN
    ru.ticket.journey.WikimapiaKeyProvider: DEBUG
    ru.ticket.journey.walk.WikimapiaPoiSourceImpl: DEBUG
    ru.ticket.journey.WikimapiaPlaces: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
