server:
  port: 8080
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  jackson:
    deserialization:
      fail-on-unknown-properties: false
      fail-on-ignored-properties: false
      fail-on-null-for-primitives: false

  datasource:
    url: jdbc:h2:file:./data/ticket-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  h2:
    console:
      enabled: false
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ openid, profile, email ]
            redirect-uri: "${APP_FRONTEND_URL:https://www.codoc.site}/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com
  mail:
    host: ${SMTP_HOST:smtp.mail.ru}
    port: ${SMTP_PORT:${SMTP_PORT_SSL:465}}
    protocol: smtp
    username: ${SMTP_USER:ksu_shest@mail.ru}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SMTP_READ_TIMEOUT:30000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:30000}
          ssl:
            enable: ${SMTP_SSL:true}
          starttls:
            enable: ${SMTP_TLS:false}
            required: ${SMTP_TLS:false}

app:
  frontend-url: ${APP_FRONTEND_URL:https://www.codoc.site}
  cookie-secure: ${APP_COOKIE_SECURE:true}

  # B11: скрывать ли детали исключений в 500-ответах.
  # В prod — false (значение по умолчанию). В локальном профиле можно
  # включить, чтобы видеть причину в браузере без похода в логи.
  expose-error-details: ${APP_EXPOSE_ERROR_DETAILS:false}

  # H1: rate limit для дорогих эндпоинтов.
  # Токен-бакет per-user (или IP для анонимных). Значения — «за минуту».
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    export-per-minute: ${APP_RATE_LIMIT_EXPORT:20}
    generate-per-minute: ${APP_RATE_LIMIT_GENERATE:10}

  # B8: лимит байтов кэша изображений в HttpImageEmbedder.
  # При превышении старые записи вытесняются.
  image-embedder:
    max-cache-bytes: ${APP_IMAGE_CACHE_BYTES:67108864}  # 64 MB
  email:
    default-from: ${EMAIL_FROM:${SMTP_USER:ksu_shest@mail.ru}}
    default-subject: ${EMAIL_SUBJECT:Документ от codoc}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-replace-me-in-prod-000000}
  access-token-ttl-ms: 900000
  refresh-token-ttl-ms: 604800000
  issuer: ticket-editor

logging:
  level:
    ru.ticket: INFO
    org.apache.pdfbox: WARN
    org.apache.batik: WARN


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
