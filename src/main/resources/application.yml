server:
  port: 8080
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  # Гибкая десериализация: неизвестные поля от фронта игнорируем.
  # Без этого фронт присылает styleId / symbolId / rasterFill / valueField
  # и т.п., которых нет в Java-DTO → Jackson 500.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      fail-on-ignored-properties: false
      fail-on-null-for-primitives: false

  datasource:
    url: jdbc:h2:file:./data/ticket-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ openid, profile, email ]
            redirect-uri: "${APP_FRONTEND_URL:https://www.codoc.site}/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com

app:
  frontend-url: ${APP_FRONTEND_URL:https://www.codoc.site}
  cookie-secure: ${APP_COOKIE_SECURE:true}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-replace-me-in-prod-000000}
  access-token-ttl-ms: 900000
  refresh-token-ttl-ms: 604800000
  issuer: ticket-editor

logging:
  level:
    ru.ticket: DEBUG
    org.apache.pdfbox: WARN
    org.apache.batik: WARN