spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/codoc}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:codoc}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: ${DB_SCHEMA_MODE:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
