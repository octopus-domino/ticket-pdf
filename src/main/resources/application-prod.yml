spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/upgrade-email-ledger.sql,classpath:db/upgrade-template-folders.sql,classpath:db/upgrade-client-api.sql,classpath:db/upgrade-connectors.sql,classpath:db/upgrade-history.sql,classpath:db/upgrade-libraries.sql,classpath:db/upgrade-profile.sql,classpath:db/upgrade-journeys.sql,classpath:db/upgrade-workflows.sql,classpath:db/upgrade-mystic-places.sql,classpath:db/upgrade-building-history.sql
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
jwt:
  secret: ${JWT_SECRET}
app:
  workflow:
    admin-user-ids: ${WORKFLOW_ADMIN_USER_IDS:}
  cookie-secure: true
  expose-error-details: false
