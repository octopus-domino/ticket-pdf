spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/upgrade-email-ledger.sql,classpath:db/upgrade-template-folders.sql,classpath:db/upgrade-client-api.sql,classpath:db/upgrade-connectors.sql,classpath:db/upgrade-history.sql,classpath:db/upgrade-libraries.sql,classpath:db/upgrade-profile.sql,classpath:db/upgrade-journeys.sql,classpath:db/upgrade-workflows.sql
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
jwt:
  secret: ${JWT_SECRET}
management:
  server:
    port: ${CODOC_MANAGEMENT_PORT:9080}
    address: 127.0.0.1
app:
  workflow:
    admin-user-ids: ${WORKFLOW_ADMIN_USER_IDS:}
  cookie-secure: true
  expose-error-details: false
